[general]
description = E-QuakeVis PSHA jabar_0p1 (GEM IDN v2017.1.0)
calculation_mode = classical
random_seed = 23

[geometry]
sites_csv = sites.csv

[logic_tree]
number_of_logic_tree_samples = 0

[erf]
rupture_mesh_spacing = 5
complex_fault_mesh_spacing = 10
width_of_mfd_bin = 0.1
area_source_discretization = 10.0

[site_params]
reference_vs30_type = measured
reference_vs30_value = 760.0
reference_depth_to_1pt0km_per_sec = 30.0
reference_depth_to_2pt5km_per_sec = 0.57

[calculation]
source_model_logic_tree_file = ../../gem_idn_v2017.1.0/in/ssmLT.xml
gsim_logic_tree_file = ../../gem_idn_v2017.1.0/in/gmmLT.xml
investigation_time = 50.0
intensity_measure_types_and_levels = {
    "PGA": logscale(0.005, 3.0, 25),
    "SA(0.2)": logscale(0.005, 9.0, 25),
    "SA(1.0)": logscale(0.005, 3.6, 25)}
truncation_level = 5.0
maximum_distance = {'default': 300.}
horiz_comp_to_geom_mean = true
pointsource_distance = 200
reqv_file = {
  "Active Shallow Crust": "../../gem_idn_v2017.1.0/in/lookup_reqv_asc.hdf5",
  "Subduction Inslab": "../../gem_idn_v2017.1.0/in/lookup_reqv_slb.hdf5"}

[output]
export_dir = export
mean_hazard_curves = true
quantile_hazard_curves =
hazard_maps = true
uniform_hazard_spectra = false
poes = 0.1 0.02
