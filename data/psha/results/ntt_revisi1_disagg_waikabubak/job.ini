[general]
description = Disagregasi Waikabubak ntt_revisi1
calculation_mode = disaggregation
random_seed = 23

[geometry]
sites_csv = sites.csv

[logic_tree]
number_of_logic_tree_samples = 0

[erf]
rupture_mesh_spacing = 5
complex_fault_mesh_spacing = 20
width_of_mfd_bin = 0.1
area_source_discretization = 10.0

[site_params]
reference_vs30_type = measured
reference_vs30_value = 760.0
reference_depth_to_1pt0km_per_sec = -999
reference_depth_to_2pt5km_per_sec = -999

[calculation]
source_model_logic_tree_file = ../../source_models/ntt_revisi1_sumber/ssmLT.xml
gsim_logic_tree_file = gmmLT.xml
investigation_time = 50.0
intensity_measure_types_and_levels = {
    "PGA": logscale(0.005, 3.0, 25),
    "SA(0.2)": logscale(0.005, 9.0, 25),
    "SA(1.0)": logscale(0.005, 3.6, 25)}
truncation_level = 5.0
maximum_distance = {'Subduction Interface': 1000, 'default': 300}
horiz_comp_to_geom_mean = true
pointsource_distance = 200
reqv_file = {
  "Active Shallow Crust": "../../gem_idn_v2024.0.0/in/lookup_reqv_asc.hdf5",
  "Subduction Intraslab": "../../gem_idn_v2024.0.0/in/lookup_reqv_slb.hdf5"}

[disaggregation]
poes_disagg = 0.1 0.02
mag_bin_width = 0.5
distance_bin_width = 20
coordinate_bin_width = 10
num_epsilon_bins = 6
disagg_outputs = Mag Dist TRT Mag_Dist Mag_Dist_Eps TRT_Mag_Dist
disagg_by_src = true

[output]
export_dir = export
mean_hazard_curves = true
